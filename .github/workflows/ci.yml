name: CI

# Two jobs. `tests` runs a released twill over every file, the suites and the
# examples, which is the gate that matters. `check` is the set of things a
# compiler has no opinion about and that would otherwise quietly rot: the source
# staying twill, the old name staying gone, the palette staying twill's.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every source file is twill
        run: |
          # A file that is not .tw in src/ or tests/ means someone reached for
          # another language when this one got hard. That is the one failure
          # this repository exists to not have.
          bad=$(find src tests examples -type f ! -name '*.tw' || true)
          if [ -n "$bad" ]; then
            echo "not twill source:"
            echo "$bad"
            exit 1
          fi

      - name: No trace of the old name
        run: |
          # The language was renamed and the old name must not come back through
          # a copied comment or a stale path. The needle is assembled from two
          # halves so that this workflow file is not itself a hit, which would
          # make the check permanently red.
          old_name="ras""ter"
          old_ext="\\.""ra\\b"
          if grep -rIn --exclude-dir=.git -- "$old_name" . ; then
            echo "the old language name appears above"
            exit 1
          fi
          if grep -rIn --exclude-dir=.git -- "$old_ext" . ; then
            echo "the old file extension appears above"
            exit 1
          fi

      - name: No em dashes
        run: |
          dash=$(printf '\xe2\x80\x94')
          if grep -rIn --exclude-dir=.git -- "$dash" . ; then
            echo "em dash found above"
            exit 1
          fi

      - name: Every test file reports
        run: |
          # `twill test` discovers the files, so this is no longer about
          # discovery. A test file is still a program, and one that never calls
          # `report` exits 0 whatever its cases did. This check is what stops a
          # suite passing by saying nothing.
          for f in tests/*_test.tw; do
            tail -n 1 "$f" | grep -q "t.report(" || { echo "$f does not end in t.report"; exit 1; }
          done

      - name: The palette is twill's
        run: |
          # Five hexes, and no sixth. A plotting library is exactly the kind of
          # place a colour gets invented at three in the morning.
          if grep -rIn --include='*.tw' --include='*.svg' -oE '#[0-9A-Fa-f]{6}' src assets \
              | grep -viE '#(D2F0E4|A8DCCB|7FE3C4|4FB79B|12332C)' ; then
            echo "colour outside twill's palette above"
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The twill binary comes from a release rather than being built here.
      # weft is written in twill and has no build of its own, so the only
      # thing CI needs is a compiler, and a released one is the version a user
      # would have. Pinned rather than floating: a green run should mean this
      # code passed against a known compiler, not against whatever was newest
      # that morning.
      - name: Install twill v1.7.1
        run: |
          curl -fsSL -o twill \
            https://github.com/twill-lang/twill/releases/download/v1.7.1/twill-v1.7.1-linux-amd64
          chmod +x twill
          ./twill --version

      # Every .tw file in the repository, not a fixed list of directories.
      # The list used to be `src tests examples`, which silently excluded
      # anything else: bobbin's suites/ and spool's main.tw were both real
      # programs that CI never checked, and both were broken because of it.
      - name: Check every source file
        run: |
          skip=""
          fail=0
          for f in $(find . -name '*.tw'); do
            case " $skip " in *" $f "*) continue ;; esac
            if ! ./twill check "$f"; then
              fail=1
            fi
          done
          exit $fail

      - name: Run the tests
        run: ./twill test tests

      # Checking an example is not the same as running it. `twill check`
      # follows imports for enum declarations only, so it cannot see a call
      # into another module whose signature changed -- a stale helper, a `Res`
      # bound where a `Str` was expected, an entry point that runs twice.
      # Every one of those was found by running a program and none of them by
      # checking one.
      - name: Run the examples
        run: ./twill run examples/loss.tw > /dev/null
